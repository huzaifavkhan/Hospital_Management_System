services:
  postgres:
    image: postgres:15-alpine
    container_name: hospital_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_pass
      POSTGRES_DB: hospital_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hospital_user -d hospital_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: hospital_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://hospital_user:hospital_pass@postgres:5432/hospital_db
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:3000
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin123
      SEED_RECEPTIONIST_USERNAME: receptionist
      SEED_RECEPTIONIST_PASSWORD: recep123
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: 
      SMTP_PASS: 
      SMTP_FROM: 
    ports:
      - '5001:5001'
    volumes:
      - ./backend/src:/app/src
      - ./backend/server.js:/app/server.js
      - ./backend/prisma:/app/prisma

  frontend:
    build: ./frontend
    container_name: hospital_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js

volumes:
  postgres_data:
